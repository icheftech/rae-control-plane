name: R.A.E. CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend (FastAPI / Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8==7.3.0

      - name: Check critical Python errors
        run: python -m flake8 backend scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report Python style warnings
        run: python -m flake8 backend scripts --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Verify Docker for PostgreSQL tests
        run: docker info

      - name: Run pytest with coverage
        working-directory: backend
        # pytest.ini measures app coverage, requires 80%, and configures discovery.
        # Testcontainers creates PostgreSQL and applies the real migrations.
        run: python -m pytest

  frontend-checks:
    name: Frontend (Next.js / Node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Verify build
        run: npm run build
